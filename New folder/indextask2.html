<!DOCTYPE html>
<html>
<head>
    <title>Three Div Example</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div>
        <h2>First Div</h2>
        <p>This div uses the common element selector.</p>
    </div>

    <div class="second">
        <h2>Second Div</h2>
        <p>This div uses a class selector.</p>
    </div>

    <div id="third">
        <h2>Third Div</h2>
        <p>This div uses an ID selector.</p>
    </div>

</body>
</html>
